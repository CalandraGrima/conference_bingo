# Checks every premade list in lists/ whenever a list (or the settings) change. Terms that are too long show up as
# warnings on the commit; too few terms makes the check fail. It never blocks publishing the site.
name: Check terms

on:
  push:
    paths:
      - 'lists/**'
      - config.js
      - scripts/check-terms.js
  pull_request:
    paths:
      - 'lists/**'
      - config.js
      - scripts/check-terms.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-terms.js
